# Valid v0.3 fixture — ARC Power sync registry (sole source of truth)
meta:
  version: "0.3"
  stage: beta
  last_modified: "2026-05-12"
  last_modified_by: "test"
  description: "ARC Power sync registry — test fixture"

org: arc

rclone_users:
  - user: rclone_arc
    remote_name: drive
    provider: drive
    key_file: arc_drive.json
    impersonate: "system.administrator@arcpower.co"

platform:
  rclone_user: rclone_arc
  local_base: /mnt/raid/arc
  rclone_config: /var/lib/rclone_arc/.config/rclone/rclone.conf

accounts:
  - remote_name: drive
    provider: drive
    description: "ARC Power Google Workspace"
    auth:
      type: service_account
      service_account_file: /etc/rclone-sa/arc_drive.json
      impersonate: "system.administrator@arcpower.co"

    sync_defaults:
      local_subdir: drive
      schedule: "*:0/15"
      sync_flags:
        - "--use-server-modtime"
        - "--fast-list"
      exclude_patterns:
        - "*.tmp"
        - ".DS_Store"

    additional_excludes:
      - "archive/**"

    drives:
      - id: "0AM0lOfo8XiIBUk9PVA"
        cloud_name: "ARC Academy"
        local_name: academy
        enabled: true
        description: "Training materials"

      - id: "0ABO9zZb-4pBvUk9PVA"
        cloud_name: "Global Media"
        local_name: global_media
        enabled: true

      - id: "0AHW2VHH_fZemUk9PVA"
        cloud_name: "Global"
        local_name: global
        enabled: false
