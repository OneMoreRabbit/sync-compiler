[project]
name = "sync-compiler"
version = "0.4.0"
description = "Cloud sync configuration compiler for rclone-based multi-tenant fileserver"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "ruamel.yaml>=0.17",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
sync-compile = "sync_compiler.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["sync_compiler"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
